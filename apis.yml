name: Kets
description: >-
  KETS Quantum Security is a Bristol, UK deep-tech company (incorporated 2016)
  building chip-based quantum-safe encryption and networking hardware. Its
  product line spans Quantum Key Distribution (QKD), Quantum Random Number
  Generators (QRNG), and the KETS KORE sub-system, delivering security grounded
  in the laws of physics rather than computational complexity. KETS technology
  hardens telecommunications networks, satellite and aerospace communications
  (including Airbus collaborations), data-center backups, and critical
  infrastructure control systems against the emerging threat of quantum
  computing. Backed by European quantum-specialist venture investors including
  Speedinvest and supported by multiple UK government funding awards, KETS is
  a hardware and photonics company; it does not currently publish a public API,
  SDK, or developer portal. This profile was added to the API Evangelist network
  as a Speedinvest portfolio lead and enriched with identity and domain-security
  signals.
